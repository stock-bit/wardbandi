<!DOCTYPE html>
<html>
<head>
  <title>Ward Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

  <style>
    body { margin: 0; }
    #map { height: 100vh; }
  </style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

// Normal map
var normal = L.tileLayer(
  'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
  {
    attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
    subdomains: 'abcd',
    maxZoom: 19
  }
);

// Satellite
var satellite = L.tileLayer(
  'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  {
    attribution: 'Tiles © Esri',
    maxZoom: 19
  }
);

// Initialize map with normal view
var map = L.map('map', {
  center: [28.2, 76.6],
  zoom: 12,
  layers: [satellite]
});

// Toggle control
var baseMaps = {
  "Normal Map": normal,
  "Satellite": satellite
};

L.control.layers(baseMaps).addTo(map);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
  subdomains: 'abcd',
  maxZoom: 19
}).addTo(map);


// Random color generator
function getColor() {
  return '#' + Math.floor(Math.random()*16777215).toString(16);
}

fetch('wards.geojson')
  .then(res => res.json())
  .then(data => {

    L.geoJSON(data, {
     style: function(feature) {
        return {
          color: "#000",
          weight: 2,
          fillColor: getColor(),
          fillOpacity: 0.2
        };
      },

      onEachFeature: function (feature, layer) {
        let name = feature.properties.name || feature.properties.Ward || "Ward";

        layer.bindPopup("<b>" + name + "</b>");

        layer.on({
          mouseover: function(e) {
            e.target.setStyle({ fillOpacity: 0.1 });
          },
          mouseout: function(e) {
            e.target.setStyle({ fillOpacity: 0.5 });
          }
        });
      }

    }).addTo(map);

  });
</script>

</body>
</html>
